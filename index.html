<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- ✅ Favicon / Apple touch icon -->
    <link rel="icon" type="image/jpeg" href="/images/icon.jpg" />
    <link rel="apple-touch-icon" href="/images/icon.jpg" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta -->
    <title>Smash Point — Dink Fast. Smash Hard.</title>
    <meta
      name="description"
      content="Book premium pickleball courts at Smash Point. Reserve your slot in seconds, pay with GCash, and get playing."
    />

    <!-- Fonts (loaded via @import in src/index.css, preconnects here for speed) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!--
      ⚠️ IMPORTANT: All absolute URLs below MUST match your live deployed domain.
      Current live domain: https://smashpointpicklecenter.vercel.app/
      If this changes, update og:url, og:image, og:image:secure_url,
      and twitter:image accordingly. Then re-scrape via:
      https://developers.facebook.com/tools/debug/
    -->

    <!-- Open Graph (Messenger, WhatsApp, Slack, Discord, iMessage, Telegram, Facebook) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Smash Point" />
    <meta property="og:title" content="Smash Point — Dink Fast. Smash Hard." />
    <meta
      property="og:description"
      content="Book premium pickleball courts at Smash Point. Reserve your slot in seconds, pay with GCash, and get playing."
    />
    <meta property="og:url" content="https://smashpointpicklecenter.vercel.app/" />
    <meta property="og:image" content="https://smashpointpicklecenter.vercel.app/images/bg.jpg" />
    <meta property="og:image:secure_url" content="https://smashpointpicklecenter.vercel.app/images/bg.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Smash Point — Pickleball Court Booking" />
    <meta property="og:locale" content="en_PH" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Smash Point — Dink Fast. Smash Hard." />
    <meta
      name="twitter:description"
      content="Book premium pickleball courts at Smash Point. Reserve your slot in seconds, pay with GCash, and get playing."
    />
    <meta name="twitter:image" content="https://smashpointpicklecenter.vercel.app/images/bg.jpg" />
    <meta name="twitter:image:alt" content="Smash Point — Pickleball Court Booking" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
